# `flutter create` reescribe este fichero si no trae las exclusiones,
# asi que van declaradas para que no las vuelva a tocar.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Lo genera `flutterfire configure` y no va al repositorio.
    - lib/firebase_options.dart
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - avoid_dynamic_calls
