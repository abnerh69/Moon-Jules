name: moonjules
description: Monitor del enjambre de Jules. Solo lectura, salvo el relevo y los comandos.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  flutter_riverpod: ^2.5.1
  # Keystore/Keychain del sistema. `shared_preferences` es texto plano y
  # permitiria atrasar la marca de acceso a mano.
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

flutter:
  # Sin esto los iconos de Material salen como cuadraditos vacios.
  uses-material-design: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.0
