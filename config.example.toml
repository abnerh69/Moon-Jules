# Moon-Jules — configuracion de ejemplo.
# Copiar a ~/.config/moon-jules/config.toml y ajustar.
#
# ADR-004: la credencial se REFERENCIA, nunca se escribe aqui.
# Un valor literal es un error de arranque, no un aviso.

[jules]
api_key = "env:JULES_API_KEY"
# Solo para pruebas contra tools/mock_jules_api.py:
# base_url = "http://127.0.0.1:8377/v1alpha"
# alternativa en macOS:
# api_key = "keychain:moon-jules/jules"

[watch]
poll_interval_s = 300      # ADR-001
max_concurrency = 5        # peticiones simultaneas; limite autoimpuesto
bootstrap_lookback_s = 86400  # ventana de la primera consulta por sesion
full_refresh_every = 12       # cada cuantos ciclos se repagina todo
command_ttl_s      = 600      # vida de un comando de la app sin caducidad propia
stall_after_s   = 900      # ADR-002: N = 15 min, calibrado en el Spike 01
nudge_verify_s  = 600      # canario del prompt magico
default_mode    = "read_only"   # read_only | unblock_only. ADR-005.

[budgets]
# Tope de concurrencia del plan. No es un limite de Moon-Jules —no crea
# sesiones—, sino contexto: explica por que una sesion sigue en QUEUED.
max_active_sessions = 15

[publish]
# Publica el estado donde otro proceso pueda leerlo. Contrato del
# snapshot y semantica del latido: docs/SNAPSHOT.md
enabled     = false
target      = "file"        # stdout | file | rtdb
instance_id = ""            # vacio: se usa el hostname de la maquina
path        = "~/.local/state/moon-jules/snapshot.json"
decisions   = true          # sube triajes, pausas y nudges (unos KB)

# Montaje completo y reglas de seguridad: docs/RTDB.md
# [publish.rtdb]
# url             = "https://TU-PROYECTO-default-rtdb.firebaseio.com"
# root            = "moonjules"
# service_account = "~/.config/moon-jules/firebase-sa.json"
# uid             = "moonjules-writer"   # identidad bajo la que aplican las reglas
#
# Alternativa obsoleta: database secret. Es administrador y salta las
# reglas de seguridad; solo para una prueba rapida.
# auth = "env:MOONJULES_RTDB_TOKEN"

[relay]
# Relevo entre varias maquinas: solo una vigila a la vez y el telefono
# elige cual. Requiere publish.target = "rtdb". Ver docs/SNAPSHOT.md
enabled           = false
active_by_default = false   # mientras nadie este designado, nadie actua

[notify]
enabled    = false   # requiere osascript (macOS) o notify-send (Linux)
cooldown_s = 3600    # no repetir la misma alerta antes de esto
fcm        = false   # push al movil; requiere rtdb con cuenta de servicio

# Politica por source. El nombre es el `name` que devuelve `moon-jules sources`.
# Todo lo que no se declare hereda de [watch].
#
# [sources."sources/github/Informatica-ASHware/CryptBot-V3"]
# mode = "unblock_only"
# starting_branch = "main"
#
# [sources."sources/github/abnerh69/Moon-Jules"]
# mode = "read_only"        # el propio repo: se observa, no se toca

[state]
# path    = "~/.local/state/moon-jules/state.db"
# log_dir = "~/.local/state/moon-jules/logs"
